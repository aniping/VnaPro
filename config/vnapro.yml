# 网络监听；ip 默认同时用于 Web 与 SCPI，0.0.0.0 表示所有本机 IPv4 网卡。
server:
  ip: 127.0.0.1
  scpiPort: 5025
  webPort: 8080
  webEnabled: true
  # 相对路径以程序所在目录为基准；开发构建的默认 WebUI 使用源码目录的 dist。
  webRoot: WebUI
  # 需要分开绑定时取消注释；未配置时继承上面的 ip。
  # scpiIp: 127.0.0.1
  # webIp: 127.0.0.1

# 驱动 ABI 与编译后的库文件名必须匹配；库从程序所在目录加载，不填写路径。
driver:
  board: tdc1vn10
  # CMake 按实际工具链生成该文件名，Windows MinGW 的默认名称如下。
  library: libtdc1vn10_drv_sim.dll
  simulator:
    # noise 为随采集变化的模拟信号，golden 为固定黄金向量。
    mode: noise
    # 0..18446744073709551615；相同种子与相同扫描过程可以重放。
    seed: 42

# 仪器能力与启动默认值；默认扫描覆盖完整支持频段。
instrument:
  # 仅限制应用可用端口；2 端口只允许四项 S 参数，4 端口允许完整 16 项，不改变驱动数据格式。
  portCount: 4
  frequency:
    minHz: 10000000
    maxHz: 8000000000
  sweep:
    defaultStartHz: 10000000
    defaultStopHz: 8000000000
    defaultPoints: 201
    defaultIfBandwidthHz: 1000
    # 无已恢复状态时的服务器启动缺省；CONT 自动连续扫描，HOLD 等待用户触发。
    defaultSweepMode: CONT

# 日志级别：TRACE、DEBUG、INFO、WARN、ERROR、CRITICAL、OFF。
log:
  level: INFO
  # 时间、等级、线程、模块和消息；%K 为大写等级，其余沿用 spdlog。
  pattern: '%Y-%m-%d %H:%M:%S.%e [%K] [%t] %n - %v'
  console:
    enabled: true
  file:
    enabled: true
    # 相对路径以本配置文件所在目录为基准。
    path: logs/vnapro.log
    # 活动文件最多 10 MiB，另保留 5 个滚动备份。
    maxSizeBytes: 10485760
    maxFiles: 5
    # 超长记录保留截断标记，防止单条记录突破文件大小上限。
    maxRecordBytes: 65536
    # 每次启动时是否把已有的非空活动文件滚动为备份。
    rotateOnOpen: false
  flush:
    # 达到该级别立即刷盘；OFF 关闭按级别刷盘，退出时仍自动刷盘。
    level: INFO
