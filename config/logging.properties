# 日志级别：TRACE、DEBUG、INFO、WARN、ERROR、CRITICAL、OFF。
level=INFO

# 控制台输出到标准错误；文件相对路径以本配置所在目录为基准。
console.enabled=true
file.enabled=true
file.path=logs/vnapro.log

# 活动文件最多 10 MiB，另保留 5 个滚动备份。
file.max_bytes=10485760
file.backups=5

# 限制整条格式化记录的字节数；超过上限时保留截断标记。
file.max_record_bytes=65536

# true 表示每次启动时把已有的非空活动文件滚动为备份。
file.rotate_on_open=false

# 达到该级别就刷盘；OFF 关闭按级别自动刷盘，退出时仍刷盘。
flush.level=INFO

# 时间、等级、线程、模块和消息；%K 为大写等级，其余沿用 spdlog。
pattern=%Y-%m-%d %H:%M:%S.%e [%K] [%t] %n - %v
