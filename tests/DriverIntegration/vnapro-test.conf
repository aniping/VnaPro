# 每个测试进程使用独立日志文件，避免并行 CTest 互相轮转同一文件。
[logging]
file=logs/vnapro-test-{pid}.log
level=debug
flush_level=warning
max_file_bytes=1048576
max_files=2


[hardware_resources]
# 集成测试 Sink 会跨回调保留三个波块，使用 8 槽覆盖租约延寿；容量公式另做 1/2/4/8 参数化测试。
wave_pool_slot_count=8
maximum_wave_pool_payload_bytes=67108864
maximum_requested_plan_payload_bytes=16777216
maximum_prepared_sweep_payload_bytes=33554432
maximum_pending_commands_per_device=8
maximum_pending_prepare_payload_bytes_per_device=33554432
